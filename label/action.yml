name: Home Assistant Core dependency compatibility by label
description: Check Python library dependencies against Core dev or the latest Core release, chosen by pull request label
author: chemelli74

inputs:
  pyproject:
    description: Path to pyproject.toml (PEP 621 or Poetry; skipped if missing)
    required: false
    default: pyproject.toml
  setup-cfg:
    description: Path to setup.cfg (skipped if missing)
    required: false
    default: setup.cfg
  setup-py:
    description: Path to setup.py, parsed statically (skipped if missing)
    required: false
    default: setup.py
  requirements:
    description: Path to the library requirements.txt (skipped if missing)
    required: false
    default: requirements.txt
  missing-dependency-policy:
    description: How to handle library dependencies absent from Core (warn or fail)
    required: false
    default: warn

outputs:
  core-ref:
    description: Home Assistant Core ref the dependencies were compared against (empty when skipped)
    value: ${{ steps.check.outputs.core-ref }}

runs:
  using: composite
  steps:
    - name: Set up Python for dependency checker
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install checker dependency
      if: github.event.pull_request
      shell: bash
      run: python -m pip install packaging

    - name: Detect dependency changes in the pull request
      id: changes
      if: github.event.pull_request
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GH_TOKEN: ${{ github.token }}
        PYPROJECT: ${{ inputs.pyproject }}
        SETUP_CFG: ${{ inputs.setup-cfg }}
        SETUP_PY: ${{ inputs.setup-py }}
        LIBRARY_REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        set -euo pipefail
        base_dir="${RUNNER_TEMP}/ha-core-dependency-base"
        mkdir -p "$base_dir"
        # actions/checkout may not persist credentials, so authenticate this fetch only
        auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        echo "::add-mask::$auth"
        if ! git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            fetch --quiet --no-tags --depth=1 origin "$BASE_SHA" \
          || ! git archive "$BASE_SHA" | tar -x -C "$base_dir"; then
          echo "::warning::Cannot read the base commit; treating dependencies as changed"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        python "${{ github.action_path }}/../scripts/deps_changed.py" \
          --base-dir "$base_dir" \
          --pyproject "$PYPROJECT" \
          --setup-cfg "$SETUP_CFG" \
          --setup-py "$SETUP_PY" \
          --library-requirements "$LIBRARY_REQUIREMENTS"

    - name: Select Core ref from pull request labels
      id: select
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        DEPS_CHANGED: ${{ steps.changes.outputs.changed }}
      run: python "${{ github.action_path }}/../scripts/select_ref.py"

    - name: Compare library dependencies with Core
      id: check
      if: steps.select.outputs.skip == 'false'
      shell: bash
      env:
        HA_CORE_REF: ${{ steps.select.outputs.core-ref }}
        GH_TOKEN: ${{ github.token }}
        PYPROJECT: ${{ inputs.pyproject }}
        SETUP_CFG: ${{ inputs.setup-cfg }}
        SETUP_PY: ${{ inputs.setup-py }}
        LIBRARY_REQUIREMENTS: ${{ inputs.requirements }}
        MISSING_POLICY: ${{ inputs.missing-dependency-policy }}
      run: "${{ github.action_path }}/../scripts/run.sh"
